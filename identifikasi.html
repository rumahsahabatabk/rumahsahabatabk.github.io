        /* ===========================
   PAGE HEADER
=========================== */

.page-header{
    margin-top:83px;
    padding:110px 20px;
    text-align:center;
    color:#fff;
}

.page-header h1{
    font-size:42px;
    margin-bottom:15px;
}

.page-header p{
    font-size:18px;
    opacity:.95;
}


.identifikasi{
    padding:50px 0;
}

.table-title{
    margin:40px 0 15px;
    color:#003f88;
    font-size:24px;
    font-weight:600;
}

.container h3{
    margin-bottom: 20px;
}

.table-responsive{
    overflow-x:auto;
}

.custom-table{
    width:100%;
    border-collapse:separate;
    border-spacing:0;
    background:#fff;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.custom-table thead{
    background:linear-gradient(135deg,#0d6efd,#003f88);
}

.custom-table thead th{
    color:#fff;
    padding:16px;
    font-size:15px;
    font-weight:600;
    text-align:left;
}

.custom-table tbody td{
    padding:16px;
    border-bottom:1px solid #eef2f7;
    color:#555;
    vertical-align:middle;
}

.custom-table tbody tr:last-child td{
    border-bottom:none;
}

.custom-table tbody tr{
    transition:.25s;
}

.custom-table tbody tr:hover{
    background:#f8fbff;
}

.custom-table tbody td:first-child{
    width:70px;
    text-align:center;
    font-weight:600;
    color:#003f88;
}

.custom-table tbody td:last-child{
    text-align:center;
}

.btn-link{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:10px 18px;
    background:#0d6efd;
    color:#fff;
    text-decoration:none;
    border-radius:8px;
    font-size:14px;
    font-weight:500;
    transition:.3s;
}

.btn-link:hover{
    background:#003f88;
    transform:translateY(-2px);
    box-shadow:0 8px 18px rgba(13,110,253,.25);
}

.btn-link i{
    font-size:14px;
}

.section-space{
    margin-top:60px;
}

@media(max-width:768px){

    .custom-table thead th,
    .custom-table tbody td{
        padding:12px;
        font-size:14px;
    }

    .btn-link{
        padding:8px 14px;
        font-size:13px;
    }
    .title h2{
        font-size: 20px;
    }

.identifikasi{
    padding:40px 0;
}

.page-header{

    padding:80px 20px;

}

.page-header h1{

    font-size:26px;

}

}
</style>

</head>

<script src="script.js"></script>
<script type="text/javascript">
const API_KEY = "AIzaSyC_bF2r4x-qbv48Zcyg2dadlqGr5KPNG0M";
const SHEET_ID = "1J3EldqNBHHIz5xr2JKWtQRE28AmUuPBZaK0L6hkqSeo";

function driveImage(id){
    return `https://drive.google.com/thumbnail?id=${id}&sz=w2000`;
}

function driveLogo(id){
    return `https://lh3.googleusercontent.com/d/${id}=w200`;
}

// ===============================
// NAVBAR & FOOTER
// ===============================

async function loadNavFooter(){

    const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/Nav_Footer!A1:E20?key=${API_KEY}`;

    const res = await fetch(url);
    const data = await res.json();

    const rows = data.values || [];

    // Navbar
    document.getElementById("logo-sekolah").src = driveLogo(rows[2][1]);
    document.getElementById("nama-brand").textContent = rows[2][2];
    document.getElementById("motto-brand").textContent = rows[2][3];

    document.getElementById("page-header").style.background = `
        linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.55)),
        url(${driveImage(rows[2][4])}) center/cover no-repeat
    `;

    // Footer
    document.getElementById("footer-title").textContent = rows[5][1];
    document.getElementById("footer-address").textContent = rows[5][2];
    document.getElementById("footer-copy").textContent = rows[5][4];

    document.getElementById("facebook-link").href = rows[6][1];
    document.getElementById("instagram-link").href = rows[6][2];
    document.getElementById("youtube-link").href = rows[6][4];

}

// ===============================
// LOAD IDENTIFIKASI
// ===============================

async function loadIdentifikasi(){

    const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/Identifikasi!A1:C100?key=${API_KEY}`;

    const res = await fetch(url);
    const data = await res.json();

    const rows = data.values || [];

    // Header halaman
    document.getElementById("page-title").textContent = rows[0]?.[2] || "";
    document.getElementById("page-subtitle").textContent = rows[1]?.[2] || "";

    // Judul konten
    document.getElementById("contentTitle").textContent = rows[2]?.[2] || "";
    document.getElementById("contentSubtitle").textContent = rows[3]?.[2] || "";

    // ==========================
    // FORM APLIKASI
    // ==========================

    const formBody = document.getElementById("formTableBody");
    formBody.innerHTML = "";

    for(let i=5;i<11;i++){

        const row = rows[i];

        if(!row || !row[1]) continue;

        formBody.innerHTML += `
            <tr>
                <td>${row[0] || ""}</td>
                <td>${row[1] || ""}</td>
                <td style="text-align:center">
                    <a href="${row[2]}" target="_blank" class="btn-link">
                        Buka Form
                    </a>
                </td>
            </tr>
        `;
    }

    // ==========================
    // DOKUMEN PDF
    // ==========================

    const pdfBody = document.getElementById("pdfTableBody");
    pdfBody.innerHTML = "";

    for(let i=12;i<100;i++){

        const row = rows[i];

        if(!row || !row[1]) continue;

        pdfBody.innerHTML += `
            <tr>
                <td>${row[0] || ""}</td>
                <td>${row[1] || ""}</td>
                <td style="text-align:center">
                    <a href="${row[2]}" target="_blank" class="btn-link">
                        Download
                    </a>
                </td>
            </tr>
        `;
    }

}

// ===============================
// INIT
// ===============================

document.addEventListener("DOMContentLoaded", async () => {

    await loadNavFooter();

    await loadIdentifikasi();

});
</script>

            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(280px,1fr));

            margin-top:40px;
        }

        .vision-card{
            background:#fff;
            padding:30px;
            border-radius:18px;
            box-shadow:0 10px 25px rgba(0,0,0,.08);

        .vision-card h3{
            color:#0d6efd;
            margin-bottom:15px;
        }

        .vision-card ul{
            padding-left:20px;
            line-height:1.8;
        }

        @media(max-width:768px){
            .profile-grid{
                grid-template-columns:1fr;
            }

            .page-header h1{
                font-size:26px;
            }
        }

<script>
const API_KEY = "AIzaSyAwSuM68_HlFIUxvR1HOmlIwo4pMKEnHU0";
const SHEET_ID = "1P_Tz_MT08L-UQel8Rq3SaYd-jhFKb7knSHOJqmv_8-E";

function driveLogo(id){
    return `https://lh3.googleusercontent.com/d/${id}=w200`;
}

function driveImage(id){
    return `https://lh3.googleusercontent.com/d/${id}=w2000`;
}

function driveImages(id){
    return `https://drive.google.com/thumbnail?id=${id}&sz=w2000`;
}


async function loadNavFooter(){

    const url=`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/Nav_Footer!A1:E20?key=${API_KEY}`;

    const res=await fetch(url);

    const data=await res.json();

    const rows=data.values || [];

    // ========= NAVBAR =========

    const logoId=rows[2][1];
    const brand=rows[2][2];
    const motto=rows[2][3];
    const bgId=rows[2][4];

    document.getElementById("logo-sekolah").src = driveImage(logoId);

    document.getElementById("nama-brand").textContent=brand;

    document.getElementById("motto-brand").textContent=motto;

    const DEFAULT_HEADER =
    "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhpBdQ0hlKtWUcOE_8WJwSdDmx6xUSiCrm04RSLfIHR4pxuRku44s5RnAo50Mk3K6VVTmHzBkstWVXFDvqy9pixJwAIDP-jo25UTFs66QqKmj4FwfqEYtwdzVVr6PIeOS_g_PFgwOZTz-xXHJsMABtqmPyoQtVgZYV6n0MzuqHG94RwShYBU-A2ZVyzcZs/s400/abk1.png";

    const bgUrl = driveImages(bgId);

    const testImg = new Image();

    testImg.onload = function(){

        document.getElementById("page-header").style.background = `
            linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.55)),
            url(${bgUrl}) center/cover no-repeat
        `;

    };

    testImg.onerror = function(){

        document.getElementById("page-header").style.background = `
            linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.55)),
            url(${DEFAULT_HEADER}) center/cover no-repeat
        `;

    };

    testImg.src = bgUrl;

    // ========= FOOTER =========

    document.getElementById("footer-title").textContent=rows[5][1];

    document.getElementById("footer-address").textContent=rows[5][2];

    document.getElementById("footer-copy").textContent=rows[5][4];

    document.getElementById("facebook-link").href=rows[6][1];

    document.getElementById("instagram-link").href=rows[6][2];

    document.getElementById("youtube-link").href=rows[6][4];

}

async function loadProfile(){

    try{

        const url=`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/Profil_Sekolah!A1:E100?key=${API_KEY}`;

        const res=await fetch(url);
        const data=await res.json();

        const rows=data.values||[];

        /* ==========================
           HEADER
        ========================== */

        document.getElementById("page-title").textContent =
            rows[0]?.[2] || "";

        document.getElementById("page-subtitle").textContent =
            rows[1]?.[2] || "";

        const about=document.getElementById("about-school");
        const image=document.getElementById("school-image");
        const vision=document.getElementById("school-vision");
        const mission=document.getElementById("school-mission");

        about.innerHTML=`
            <h2>${rows[2]?.[2]||""}</h2>
        `;

        vision.textContent="";
        mission.innerHTML="";

        let imageLoaded=false;
        let visionLoaded=false;

        /* ==========================
           DATA MULAI ROW 5
        ========================== */

        rows.slice(4).forEach(row=>{

            /* ----------------------
               GAMBAR
            ---------------------- */

            if(!imageLoaded && row[1]){

                let value=row[1].trim();
                let id=value;

                try{

                    if(value.includes("drive.google.com")){

                        const url=new URL(value);

                        if(url.pathname.includes("/d/")){

                            id=url.pathname.split("/d/")[1].split("/")[0];

                        }else{

                            id=url.searchParams.get("id")||value;

                        }

                    }

                }catch(e){}

                image.src=`https://drive.google.com/thumbnail?id=${id}&sz=w2000`;

                imageLoaded=true;

            }

            /* ----------------------
               TENTANG SEKOLAH
            ---------------------- */

            if(row[2]){

                about.innerHTML+=`<p>${row[2]}</p>`;

            }

            /* ----------------------
               VISI
            ---------------------- */

            if(!visionLoaded && row[3]){

                vision.textContent=row[3];
                visionLoaded=true;

            }

            /* ----------------------
               MISI
            ---------------------- */

            if(row[4]){

                mission.innerHTML+=`
                    <li>${row[4]}</li>
                `;

            }

        });

    }catch(err){

        console.error(err);

    }

}

document.addEventListener("DOMContentLoaded", () => {
    loadNavFooter();
    loadProfile();
});
</script>

<script type="text/javascript">
const API_KEY = "AIzaSyAwSuM68_HlFIUxvR1HOmlIwo4pMKEnHU0";

function driveLogo(id){
    return `https://lh3.googleusercontent.com/d/${id}=w200`;
}

function driveImage(id){
    return `https://lh3.googleusercontent.com/d/${id}=w2000`;
}

function driveImages(id){
    return `https://drive.google.com/thumbnail?id=${id}&sz=w2000`;
}


async function loadNavFooter(){

    const url=`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/Nav_Footer!A1:E20?key=${API_KEY}`;

    const res=await fetch(url);

    const data=await res.json();

    const rows=data.values || [];

    const logoId=rows[2][1];
    const brand=rows[2][2];
    const motto=rows[2][3];
    const bgId=rows[2][4];

    document.getElementById("nama-brand").textContent=brand;

    document.getElementById("motto-brand").textContent=motto;

    const DEFAULT_HEADER =

    const bgUrl = driveImages(bgId);

    const testImg = new Image();

    testImg.onload = function(){

        document.getElementById("page-header").style.background = `
            linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.55)),
            url(${bgUrl}) center/cover no-repeat
        `;

    };

    testImg.onerror = function(){

        document.getElementById("page-header").style.background = `
            linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.55)),
            url(${DEFAULT_HEADER}) center/cover no-repeat
        `;

    };

    testImg.src = bgUrl;

    // ========= FOOTER =========

    document.getElementById("footer-title").textContent=rows[5][1];

    document.getElementById("footer-address").textContent=rows[5][2];

    document.getElementById("footer-copy").textContent=rows[5][4];

    document.getElementById("facebook-link").href=rows[6][1];

    document.getElementById("instagram-link").href=rows[6][2];

    document.getElementById("youtube-link").href=rows[6][4];

}

/* ==========================================
   GOOGLE SHEETS API
========================================== */

async function getSheet(range) {

    const url =
        `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(range)}?key=${API_KEY}`;

    const response = await fetch(url);

    if (!response.ok) {
        throw new Error("Gagal mengambil data.");
    }

    const data = await response.json();

    return data.values || [];

}

/* ==========================================
   LOAD PROFIL LAYANAN
========================================== */

async function loadLayanan() {

    try {

        const rows = await getSheet("Profil_Layanan!A1:C100");

        // Header
        document.getElementById("page-title").textContent =
            rows[0]?.[2] || "";

        document.getElementById("page-subtitle").textContent =
            rows[1]?.[2] || "";

        document.getElementById("gallery-title").textContent =
            rows[2]?.[2] || "";
        document.getElementById("gallery-subtitle").textContent =
            rows[3]?.[2] || "";

        // Jika nanti ingin memakai sub judul konten
        // rows[3][2]

        const gallery = document.getElementById("gallery-list");

        gallery.innerHTML = "";

        // Mulai membaca gambar dari baris ke-6 (index 5)
        for (let i = 5; i < rows.length; i++) {

            let value = (rows[i][1] || "").trim();

            if (!value) continue;

            let id = value;

            try {

                if (value.includes("drive.google.com")) {

                    const url = new URL(value);

                    if (url.pathname.includes("/d/")) {

                        id = url.pathname.split("/d/")[1].split("/")[0];

                    } else {

                        id = url.searchParams.get("id") || value;

                    }

                }

            } catch (e) {}

            gallery.innerHTML += `
                <img
                    src="https://drive.google.com/thumbnail?id=${id}&sz=w2000"
                    alt="">
            `;

        }

    } catch (err) {

        console.error(err);

    }

}

document.addEventListener("DOMContentLoaded", () => {
    loadNavFooter();
    loadLayanan();
});
</script>
